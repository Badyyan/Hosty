name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build

  migrate-check:
    name: Validate migrations
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hosty
          POSTGRES_PASSWORD: hosty
          POSTGRES_DB: hosty
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hosty" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply schema to a fresh database
        run: npx prisma migrate deploy || npx prisma db push
        env:
          DATABASE_URL: postgresql://hosty:hosty@localhost:5432/hosty

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [build, migrate-check]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t hosty:${{ github.sha }} .
      # Push to your registry + deploy to staging (main) / production (tags):
      # - aws ecr get-login-password | docker login …
      # - docker push …
      # - aws ecs update-service --force-new-deployment …
      # Production deploys (v* tags) should sit behind a GitHub environment
      # with required reviewers for the manual approval gate.
