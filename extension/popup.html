<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 340px; font: 13px/1.5 system-ui, sans-serif; margin: 0; background: #fff; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #12151c; color: #e5e9f0; } .card, input { background:#1a1f29!important; border-color:#2a3140!important; color:#e5e9f0!important } }
  header { display:flex; align-items:center; gap:8px; padding: 12px 14px; border-bottom: 1px solid #e7eaf0; font-weight: 700; }
  header .dot { color:#3563f9 }
  section { padding: 12px 14px; }
  input { width: 100%; box-sizing: border-box; border: 1px solid #d7dce6; border-radius: 8px; padding: 8px 10px; font-size: 12px; margin-bottom: 8px; }
  button { width: 100%; background: #3563f9; color: #fff; border: 0; border-radius: 8px; padding: 9px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5 }
  .drop { border: 2px dashed #c6cede; border-radius: 12px; padding: 22px 10px; text-align: center; color: #667; margin-bottom: 10px; transition: all .15s; }
  .drop.over { border-color: #3563f9; background: #eef4ff; color: #3563f9; }
  .card { border: 1px solid #e7eaf0; border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }
  .card a { color: #3563f9; text-decoration: none; font-weight: 600; font-size: 12px; }
  .muted { color: #889; font-size: 11px; }
  .ok { color: #0a7f3f; font-weight: 600; }
  .err { color: #c62828; }
  .row { display:flex; gap:6px }
  .row button { width:auto; flex:1; font-size:12px; padding:7px }
  .ghost { background:transparent; color:#3563f9; border:1px solid #3563f9 }
  h4 { margin: 4px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #98a; }
</style>
</head>
<body>
  <header><span class="dot">▲</span> Hosty <span class="muted" id="who"></span></header>

  <section id="login-view" hidden>
    <p class="muted">Paste an API key from <b>Dashboard → API keys</b>.</p>
    <input id="base-url" placeholder="https://hosty.site">
    <input id="api-key" placeholder="hty_…" type="password">
    <button id="login-btn">Connect</button>
    <p id="login-msg" class="err"></p>
  </section>

  <section id="main-view" hidden>
    <div class="drop" id="drop">📤 Drop a file here<br><span class="muted">ZIP · HTML · PDF · image · docs</span></div>
    <input type="file" id="file-input" hidden>
    <div class="row">
      <button id="pick-btn" class="ghost">Choose file</button>
      <button id="grab-btn" title="Grab the latest HTML/code block from the open AI chat tab">Publish AI code</button>
    </div>
    <p id="status" class="muted"></p>

    <h4>Recent projects</h4>
    <div id="projects"></div>
    <p class="muted" style="margin-top:10px"><a href="#" id="logout">Sign out</a></p>
  </section>

  <script src="popup.js"></script>
</body>
</html>
